spring:
  application:
    name: account-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH0_JWT_ISSUER_URI}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:account_db}?sslmode=require
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # NEW: Upstash requires authenticating using your password token
      username: ${REDIS_USERNAME:default}
      password: ${REDIS_PASSWORD:}
      # NEW: Mandatory flag to encrypt traffic to the cloud database
      ssl:
        enabled: ${REDIS_SSL_ENABLED:true}

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    properties:
      # Mandatory security configurations for Confluent Cloud
      security.protocol: SASL_SSL
      sasl.mechanism: PLAIN
      # Inject username and password securely from environment variables
      sasl.jaas.config: org.apache.kafka.common.security.plain.PlainLoginModule required username="${SPRING_KAFKA_JAAS_USERNAME}" password="${SPRING_KAFKA_JAAS_PASSWORD}";

    consumer:
      group-id: account-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: false
        spring.json.value.default.type: "java.util.HashMap"

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health, info

logging:
  level:
    org:
      springframework:
        cache: TRACE
        security: DEBUG

app:
  auth0:
    audience: https://bankingapp.com