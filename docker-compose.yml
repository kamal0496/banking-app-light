version: '3.8'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_4LW_COMMANDS_WHITELIST: "ruok,srvr,stat"
      KAFKA_HEAP_OPTS: "-Xms128m -Xmx128m"
    mem_limit: 300m
    networks:
      - banking-network
    healthcheck:
      test: [ "CMD-SHELL", "echo srvr | nc localhost 2181 | grep -q Mode" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx256m"
    mem_limit: 650m
    networks:
      - banking-network
    healthcheck:
      test: [ "CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka:29092" ]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 40s

  account-service:
    image: account-service:redis
    container_name: account-service
    ports:
      - "8081:8081"
    environment:
      # Postgres connection
      DB_HOST: ep-purple-bar-b4c4htfu-pooler.c-6.us-east-2.aws.neon.tech
      DB_PORT: 5432
      DB_USERNAME: neondb_owner
      DB_PASSWORD: npg_ykrtXng8U3vJ
      DB_NAME: account_db

      # Redis Connection
      REDIS_HOST: lasting-hound-280262.upstash.io
      REDIS_PORT: 6379
      REDIS_USERNAME: default
      REDIS_PASSWORD: gQAAAAAABEbGAAIgcDI0ZmZmZmQ2OTY4MDA0YjJmODcxMjBjMjU0NjVhY2Q2Yg
      REDIS_SSL_ENABLED: "true"

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JAVA_TOOL_OPTIONS: "-Xms192m -Xmx256m"
    mem_limit: 400m
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - banking-network

  transaction-service:
    image: transaction-service:redis
    container_name: transaction-service
    ports:
      - "8082:8082"
    environment:
      # Postgres connection
      DB_HOST: ep-purple-bar-b4c4htfu-pooler.c-6.us-east-2.aws.neon.tech
      DB_PORT: 5432
      DB_USERNAME: neondb_owner
      DB_PASSWORD: npg_ykrtXng8U3vJ
      DB_NAME: transaction_db

      # Redis Connection
      REDIS_HOST: lasting-hound-280262.upstash.io
      REDIS_PORT: 6379
      REDIS_USERNAME: default
      REDIS_PASSWORD: gQAAAAAABEbGAAIgcDI0ZmZmZmQ2OTY4MDA0YjJmODcxMjBjMjU0NjVhY2Q2Yg
      REDIS_SSL_ENABLED: "true"

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      ACCOUNT_SERVICE_URL: http://account-service:8081
      JAVA_TOOL_OPTIONS: "-Xms192m -Xmx256m"
    mem_limit: 400m
    depends_on:
      kafka:
        condition: service_healthy
      account-service:
        condition: service_started
    networks:
      - banking-network

  fraud-detection-service:
    image: fraud-detection-service:redis
    container_name: fraud-detection-service
    ports:
      - "8083:8083"
    environment:
      # Redis Connection
      REDIS_HOST: lasting-hound-280262.upstash.io
      REDIS_PORT: 6379
      REDIS_USERNAME: default
      REDIS_PASSWORD: gQAAAAAABEbGAAIgcDI0ZmZmZmQ2OTY4MDA0YjJmODcxMjBjMjU0NjVhY2Q2Yg
      REDIS_SSL_ENABLED: "true"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      ACCOUNT_SERVICE_URL: http://account-service:8081
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx192m"
    mem_limit: 350m
    depends_on:
      kafka:
        condition: service_healthy
      account-service:
        condition: service_started
    networks:
      - banking-network

  notification-service:
    image: notification:redis
    container_name: notification-service
    ports:
      - "8085:8085"
    environment:
      # Redis Connection
      REDIS_HOST: lasting-hound-280262.upstash.io
      REDIS_PORT: 6379
      REDIS_USERNAME: default
      REDIS_PASSWORD: gQAAAAAABEbGAAIgcDI0ZmZmZmQ2OTY4MDA0YjJmODcxMjBjMjU0NjVhY2Q2Yg
      REDIS_SSL_ENABLED: "true"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      ACCOUNT_SERVICE_URL: http://account-service:8081
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx192m"
    mem_limit: 350m
    depends_on:
      kafka:
        condition: service_healthy
      account-service:
        condition: service_started
    networks:
      - banking-network

  payment-service:
    image: payment-service:redis
    container_name: payment-service
    ports:
      - "8084:8084"
    environment:
      # Postgres connection
      DB_HOST: ep-purple-bar-b4c4htfu-pooler.c-6.us-east-2.aws.neon.tech
      DB_PORT: 5432
      DB_USERNAME: neondb_owner
      DB_PASSWORD: npg_ykrtXng8U3vJ
      DB_NAME: payment_db
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JAVA_TOOL_OPTIONS: "-Xms192m -Xmx256m"
    mem_limit: 400m
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - banking-network

  api-gateway:
    image: api-gateway:redis
    container_name: api-gateway
    ports:
      - "9090:9090"
    environment:
      # Redis Connection
      REDIS_HOST: lasting-hound-280262.upstash.io
      REDIS_PORT: 6379
      REDIS_USERNAME: default
      REDIS_PASSWORD: gQAAAAAABEbGAAIgcDI0ZmZmZmQ2OTY4MDA0YjJmODcxMjBjMjU0NjVhY2Q2Yg
      REDIS_SSL_ENABLED: "true"

      ACCOUNT_SERVICE_URL: http://account-service:8081
      TRANSACTION_SERVICE_URL: http://transaction-service:8082
      PAYMENT_SERVICE_URL: http://payment-service:8084
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx192m"
    mem_limit: 350m
    depends_on:
      account-service:
        condition: service_started
      transaction-service:
        condition: service_started
      payment-service:
        condition: service_started
    networks:
      - banking-network

volumes:
  postgres_data:

networks:
  banking-network:
    driver: bridge