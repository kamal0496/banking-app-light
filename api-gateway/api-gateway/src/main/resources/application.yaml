spring:
  application:
    name: api-gateway

  security:
    oauth2:
      client:
        registration:
          auth0:
            client-id: KsyvXumHsxpuvequAuvjVK1A5ApYE0tH
            client-secret: _CoQsvB8Pn1HlinRoKvfp64w49a3dvHYGJMNf-Eer1kYiIiNgCVKHDRb8TiWCtqk
            scope: openid, profile, email
            # Default redirect-uri is {baseUrl}/login/oauth2/code/{registrationId}
            # -> http://localhost:8080/login/oauth2/code/auth0
            # This EXACT URI must be added under "Allowed Callback URLs" in your
            # Auth0 Application settings.
        provider:
          auth0:
            # Auth0's OIDC discovery document lives at {domain}/.well-known/openid-configuration
            # Spring Security fetches it at startup and auto-configures authorization,
            # token, userinfo, and jwk-set URIs from it — no need to hardcode those.
            issuer-uri: https://dev-j55571gxgfhi2bbo.us.auth0.com/

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # NEW: Upstash requires authenticating using your password token
      username: ${REDIS_USERNAME:default}
      password: ${REDIS_PASSWORD:}
      # NEW: Mandatory flag to encrypt traffic to the cloud database
      ssl:
        enabled: ${REDIS_SSL_ENABLED:true}

  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - name: DedupeResponseHeader
              args:
                name: Access-Control-Allow-Origin Access-Control-Allow-Credentials
                strategy: RETAIN_FIRST
            - TokenRelay=
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOriginPatterns: "*"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowedHeaders: "*"
                allowCredentials: true
                maxAge: 3600
          routes:
            - id: account-service
              uri: ${ACCOUNT_SERVICE_URL:http://account-service:8081}
              predicates:
                - Path=/api/v1/accounts/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20

            - id: transaction-service
              uri: ${TRANSACTION_SERVICE_URL:http://transaction-service:8082}
              predicates:
                - Path=/api/v1/transactions/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20

            - id: payment-service
              uri: ${PAYMENT_SERVICE_URL:http://payment-service:8084}
              predicates:
                - Path=/api/v1/payments/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 5
                    redis-rate-limiter.burstCapacity: 10

server:
  port: 9090

management:
  endpoint:
    gateway:
      access: read-only
  endpoints:
    web:
      exposure:
        include: health, info, gateway